name: android

# Android app checks (ADR-008): lint, unit tests and assemble devDebug. Roborazzi screenshot tests join when the
# first feature screens exist (DRIVE-72); the emulator smoke run is nightly (nightly.yml).

on:
  pull_request:
    paths: &paths
      - 'apps/android/**'
      - 'shared/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'config/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/actions/setup-build/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit tests, assemble devDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with: { android: 'true' }
      # Every library module under apps/android (DRIVE-207). The app module has product flavours, so it runs
      # its devDebug variant; the libraries run debug. A new module is picked up without editing this file.
      - name: List Android modules
        run: |
          libs="$(find apps/android -mindepth 2 -maxdepth 2 -name build.gradle.kts -not -path 'apps/android/app/*' \
            | sed -E 's#apps/android/([^/]+)/build.gradle.kts#\1#' | sort)"
          echo "Android library modules: $(echo $libs)"
          {
            printf 'DETEKT_TASKS=:apps:android:app:detekt'
            for m in $libs; do printf ' :apps:android:%s:detekt' "$m"; done; echo
            printf 'TEST_TASKS=:apps:android:app:testDevDebugUnitTest'
            for m in $libs; do printf ' :apps:android:%s:testDebugUnitTest' "$m"; done; echo
          } >> "$GITHUB_ENV"
      - name: Detekt (all Android modules)
        run: ./gradlew --console=plain $DETEKT_TASKS
      - name: Lint
        run: ./gradlew --console=plain :apps:android:app:lintDevDebug
      - name: Unit tests (all Android modules)
        run: ./gradlew --console=plain $TEST_TASKS
      - name: Assemble devDebug
        run: ./gradlew --console=plain :apps:android:app:assembleDevDebug
      - uses: actions/upload-artifact@v7
        with:
          name: app-dev-debug
          path: apps/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-lint-report
          path: apps/android/app/build/reports
          if-no-files-found: ignore
